name: Deploy to Production

on:
  workflow_run:
    workflows: [Build Image]
    types: [completed]
    branches: [main, canary]
  workflow_dispatch:
    inputs:
      target:
        description: Which Dokploy app to deploy
        type: choice
        options: [main, canary]
        default: main
      tag:
        description: Image tag to deploy (sha-xxxxxxx); empty = latest commit on the target branch
        required: false

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch || inputs.target }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/lazuardytech/pod
  DOKPLOY_URL: https://dokploy.lazuardy.tech/api

jobs:
  deploy:
    # Inert until the matching Dokploy app exists and its data is restored (vars.DOKPLOY_APPLICATION_ID_MAIN / _CANARY set).
    if: >-
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') &&
      ((github.event.workflow_run.head_branch || inputs.target) == 'main' && vars.DOKPLOY_APPLICATION_ID_MAIN != '' ||
       (github.event.workflow_run.head_branch || inputs.target) == 'canary' && vars.DOKPLOY_APPLICATION_ID_CANARY != '')
    runs-on: ubuntu-latest
    steps:
      - name: Resolve target and tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          BRANCH: ${{ github.event.workflow_run.head_branch || inputs.target }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          APP_MAIN: ${{ vars.DOKPLOY_APPLICATION_ID_MAIN }}
          APP_CANARY: ${{ vars.DOKPLOY_APPLICATION_ID_CANARY }}
        run: |
          [ "$BRANCH" = canary ] && app="$APP_CANARY" || app="$APP_MAIN"
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "tag=${INPUT_TAG:-sha-${RUN_SHA:0:7}}" >> "$GITHUB_OUTPUT"

      - name: Pin image and deploy
        env:
          KEY: ${{ secrets.DOKPLOY_API_KEY }}
          APP: ${{ steps.tag.outputs.app }}
          IMG: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
        run: |
          h=(-sS --fail-with-body -H "x-api-key: $KEY" -H "Content-Type: application/json")
          curl "${h[@]}" -X POST "$DOKPLOY_URL/application.update" -d "{\"applicationId\":\"$APP\",\"dockerImage\":\"$IMG\"}" >/dev/null
          curl "${h[@]}" -X POST "$DOKPLOY_URL/application.deploy" -d "{\"applicationId\":\"$APP\",\"title\":\"$IMG\"}" >/dev/null
          echo "Deployed $IMG" >> "$GITHUB_STEP_SUMMARY"
